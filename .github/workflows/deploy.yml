name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          # Fail with a readable message instead of an empty-value crash.
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is empty or not set — add it in Settings → Secrets and variables → Actions"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Tolerate keys pasted with literal \n instead of real newlines.
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Prove the connection works before the deploy steps depend on it.
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'echo connected to $(hostname)'

      # Only code is synced — config/triggers.json and media/ on the VM hold
      # runtime state (stims added via /stim) and must not be overwritten.
      - name: Sync code
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -av --delete -e 'ssh -o BatchMode=yes' src/ "$SSH_USER@$SSH_HOST:bot/src/"
          rsync -av -e 'ssh -o BatchMode=yes' package.json package-lock.json "$SSH_USER@$SSH_HOST:bot/"

      - name: Install deps and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/bot
            npm ci --omit=dev
            sudo -n systemctl restart vocal-stim-bot
            sleep 3
            systemctl is-active --quiet vocal-stim-bot && echo "bot is running"
          '
